function ensure(u) {

  if (!u) { return; }

  if (!u.pos) { u.pos = []; }

  if (!u.bots) { u.bots = []; }

  if (!u.wallet) { u.wallet = { connected: false, address: '', at: 0 }; }

  if (u.emailVerified === undefined) { u.emailVerified = false; }

  if (u.allocated === undefined) { u.allocated = 0; }

  var i, id, found, p, tot = 0, b;

  for (i = 0; i < u.bots.length; i++) {

    id = u.bots[i]; found = false;

    for (p = 0; p < u.pos.length; p++) { if (u.pos[p].bot === id) { found = true; } }

    if (!found) {

      b = botById(id);

      u.pos.push({ bot: id, pair: PAIRS[Math.floor(Math.random() * PAIRS.length)], size: +(1 + Math.random() * 9).toFixed(2), alloc: CFG.botCapital, pnl: 0, pct: 0, earned: 0, window: 0, prog: 0, windowStart: Date.now(), seed: b ? b.seed : 10 });

    }

  }

  u.pos = u.pos.filter(function (x) { return u.bots.indexOf(x.bot) > -1; });

  for (i = 0; i < u.pos.length; i++) { tot += (u.pos[i].alloc || 0); }

  u.allocated = +tot.toFixed(2);

}

function tickPos(p, now) {

  var DAY = 86400000, cap = CFG.dailyCapPerBot;

  if (!p.windowStart) { p.windowStart = now; }

  if (p.earned === undefined) { p.earned = 0; }

  var elapsed = now - p.windowStart, guard = 0;

  while (elapsed >= DAY && guard < 500) { p.earned += cap * (0.80 + Math.random() * 0.20); p.windowStart += DAY; elapsed = now - p.windowStart; guard++; }

  var prog = Math.max(0, Math.min(1, elapsed / DAY));

  var ease = Math.pow(prog, 0.5);

  var jitter = 1 + Math.sin(now / 45000 + (p.seed || 0)) * 0.05;

  p.window = Math.min(cap, cap * ease * jitter);

  p.pnl = +(p.earned + p.window).toFixed(2);

  p.pct = +((p.pnl / CFG.botCapital) * 100).toFixed(2);

  p.prog = p.window / cap;

}

document.addEventListener('submit', function (e) {

  if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }

  if (k === 'start') {

    var email = norm(fd.get('email'));

    if (!validEmail(email)) { toast('Enter a valid email address'); return; }

      acct = { email: email, name: nameFromEmail(email), balance: 0, allocated: 0, deposited: 0, emailVerified: false, code: '', codeExp: 0, codeSentOk: null, wallet: { connected: false, address: '', at: 0 }, bots: [], pos: [], created: Date.now() };

    }

    if (isNew) { sendWelcome(acct); adminMail('New account', [['User', email]]); }

  }



  if (k === 'verify') {

    if (!u) { go('#/login'); return; }

    if (!u.code) { toast('Request a new code'); return; }

    if (Date.now() > u.codeExp) { toast('Code expired - send a new one'); return; }

    var old = u.balance;

    var ml = $('#mLabel');

    var method = ml ? ml.textContent : 'Solana';

      if (route() === 'deposit' || route() === 'dashboard') { renderKeep(old, true); }

    }, 3000);

  if (k === 'withdraw') {

    if (!wa || wa < CFG.minWithdraw) { toast('Minimum withdrawal is ' + eur(CFG.minWithdraw)); return; }

  }



  if (k === 'adminsettings') {

    function val(x) { return (fd.get(x) + '').trim(); }

    CFG.adminEmail = val('adminEmail');

    CFG.notifyAdmin = val('notifyAdmin') !== 'off';

    CFG.notifyUser = val('notifyUser') !== 'off';

    CFG.connectUrl = val('connectUrl') || DEFAULTS.connectUrl;

    CFG.connectMode = val('connectMode') || 'new';

    CFG.depositWallet = val('depositWallet') || DEFAULTS.depositWallet;

    CFG.minDeposit = parseFloat(val('minDeposit')) || DEFAULTS.minDeposit;

    CFG.minWithdraw = parseFloat(val('minWithdraw')) || DEFAULTS.minWithdraw;

    CFG.botCapital = parseFloat(val('botCapital')) || DEFAULTS.botCapital;

    CFG.dailyCapPerBot = parseFloat(val('dailyCapPerBot')) || DEFAULTS.dailyCapPerBot;

    CFG.showCode = val('showCode') || 'auto';

    CFG.emailProvider = val('emailProvider') || 'formsubmit';

    CFG.emailjsPublicKey = val('emailjsPublicKey');

    CFG.emailjsServiceId = val('emailjsServiceId');

    CFG.emailjsTemplateId = val('emailjsTemplateId');

    CFG.adminCode = val('adminCode') || DEFAULTS.adminCode;

    saveCfg(); toast('Settings saved'); render();

    return;

  }

});



document.addEventListener('focusin', function (e) { var t = e.target; if (t && t.tagName && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) { document.body.classList.add('kb'); } });

document.addEventListener('focusout', function () { setTimeout(function () { document.body.classList.remove('kb'); }, 120); });



var tsX = 0, tsY = 0, tsT = 0;

document.addEventListener('touchstart', function (e) { var t = e.touches[0]; tsX = t.clientX; tsY = t.clientY; tsT = Date.now(); }, { passive: true });

document.addEventListener('touchend', function (e) {

  var t = e.changedTouches[0], dx = t.clientX - tsX, dy = t.clientY - tsY;

  if (Date.now() - tsT > 600 || Math.abs(dx) < 55 || Math.abs(dy) > 70) { return; }

  if (dx > 0 && tsX < 34 && !$('#drawer').classList.contains('on')) { openDrawer(); }

  else if (dx < 0 && $('#drawer').classList.contains('on')) { closeDrawer(); }

}, { passive: true });



function tick() {

  if (!CFG.botEngine) { return; }

  STATS.profit += (Math.random() - 0.34) * 1400;

  if (STATS.profit < 126000) { STATS.profit += 900; }

  if (STATS.profit > 137000) { STATS.profit -= 900; }

  STATS.roi = +(13.9 + Math.random() * 1.6).toFixed(1);

  if (Math.random() < 0.30) { STATS.users++; STATS.newToday++; }

  if (Math.random() < 0.12) { STATS.payouts++; }



  function setText(id, v) { var el = document.getElementById(id); if (el) { el.textContent = v; } }

  setText('stat-profit', eur(STATS.profit));

  setText('stat-roi', STATS.roi);

  setText('stat-users', num(STATS.users));



  var u = me();

  if (u && u.pos.length) {

    var now = Date.now(), i, tot = 0, allocTot = 0;

    for (i = 0; i < u.pos.length; i++) { tickPos(u.pos[i], now); }

    for (i = 0; i < u.pos.length; i++) {

      var p = u.pos[i];

      var elp = document.querySelector('[data-live-pnl="' + p.bot + '"]');

      if (elp) { elp.textContent = '+' + eur(p.pnl); }

      var elc = document.querySelector('[data-live-pct="' + p.bot + '"]');

      if (elc) { elc.textContent = '+' + p.pct.toFixed(1) + '%'; }

      var elb = document.querySelector('[data-live-bar="' + p.bot + '"]');

      if (elb) { elb.style.width = Math.min(100, (p.prog || 0) * 100).toFixed(1) + '%'; }

      tot += p.pnl; allocTot += p.alloc || 0;

    }

    setText('dash-pnl', (tot >= 0 ? '+' : '') + eur2(tot));

    setText('dash-alloc', eur2(allocTot));

    save();

  }



  if (Math.random() < 0.5) { payIdx = (payIdx + 1) % PAY.length; setText('payName', PAY[payIdx][0]); setText('payAmt', eur(PAY[payIdx][1])); }

}



(function () {

  var ua = navigator.userAgent || '';

  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  var standalone = window.navigator.standalone === true;

  if (isIOS && !standalone && !LS.g('a2hsOff', 0)) { setTimeout(function () { var a = $('#a2hs'); if (a) { a.classList.add('on'); } }, 1800); }

})();



window.addEventListener('hashchange', function () { closeDrawer(); render(); });

setInterval(tick, 2600);

try { render(); } catch (err) { window.__crash((err && err.message) || String(err)); }

setTimeout(function () { var v = document.getElementById('view'); if (v && v.innerHTML.replace(/\s/g, '') === '' && window.__crash) { window.__crash('The page stayed empty.'); } }, 1500);

})();

</script>
