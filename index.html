<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

:root{

  --bg:#05080B;--bg2:#080E13;--card:#0C141B;--card2:#101C26;--line:#18242F;

  --green:#00E07A;--gs:rgba(0,224,122,.10);--gb:rgba(0,224,122,.30);

  --txt:#EAF2F7;--muted:#7A8C9A;--dim:#586976;--red:#FF5C6C;--amber:#FFB84D;--blue:#4DA3FF;

  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);

  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);

  --bar:calc(66px + var(--sab));

}

html{-webkit-text-size-adjust:100%;background:#05080B}

body{margin:0;background:#05080B;color:var(--txt);overscroll-behavior-y:none;

 font-family:Inter,-apple-system,system-ui,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;

 -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;

 padding-left:var(--sal);padding-right:var(--sar)}

#app{max-width:520px;margin:0 auto;min-height:100svh;background:linear-gradient(180deg,#0A1219 0%,#080E13 320px,#080E13 100%);

 border-left:1px solid #101C26;border-right:1px solid #101C26;position:relative;overflow-x:hidden;

 padding-bottom:calc(var(--bar) + 26px)}

a{color:inherit;text-decoration:none}

button,input,select{font-family:inherit}

.btn,.tb,.chip,.tab,.lnk,.icon-btn{-webkit-user-select:none;user-select:none}

body.kb .tabbar{transform:translate(-50%,130%)}

body.kb #app{padding-bottom:26px}



/* header */

.hdr{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;

 padding:10px 14px;padding-top:calc(10px + var(--sat));

 background:rgba(8,14,19,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--txt);

 display:grid;place-items:center;cursor:pointer}

.icon-btn:active{background:#111C26}

.logo{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:-.3px;font-size:16px;flex:1;justify-content:center;white-space:nowrap}

.logo .ai{color:var(--green)}

.hdr-right{display:flex;align-items:center;gap:8px;min-width:44px;justify-content:flex-end}

.hdr-bal{font-size:12px;font-weight:700;color:var(--green);background:var(--gs);border:1px solid var(--gb);

 padding:4px 9px;border-radius:20px;white-space:nowrap}

.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(0,224,122,.15);animation:pulse 2s infinite;flex:none}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.flashup{animation:fu .7s ease}

.flashdown{animation:fd .7s ease}

@keyframes fu{0%{color:#00E07A;text-shadow:0 0 14px rgba(0,224,122,.7)}100%{}}

@keyframes fd{0%{color:#FFB84D;text-shadow:0 0 14px rgba(255,184,77,.7)}100%{}}



/* layout */

.wrap{padding:18px 16px 8px}

h1{font-size:26px;line-height:1.16;letter-spacing:-.7px;margin:0 0 10px;font-weight:800;overflow-wrap:break-word}

h2{font-size:19px;letter-spacing:-.4px;margin:0 0 4px;font-weight:700}

h3{font-size:15px;margin:0 0 6px;font-weight:700}

p{margin:0 0 12px;color:var(--muted);font-size:14.5px}

.sub{font-size:14.5px;color:var(--muted)}

.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700}

.sec{margin:26px 0 0}

.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:16px}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hr{height:1px;background:var(--line);margin:14px 0;border:0}



/* badges */

.badge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.4px;

 color:var(--green);background:var(--gs);border:1px solid var(--gb);padding:6px 11px;border-radius:20px;text-transform:uppercase}

.badge.gray{color:var(--muted);background:#111C26;border-color:var(--line)}

.badge.amber{color:var(--amber);background:rgba(255,184,77,.1);border-color:rgba(255,184,77,.3)}

.pill{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;background:#111C26;color:var(--muted);border:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}

.pill.g{color:var(--green);background:var(--gs);border-color:var(--gb)}

.pill.a{color:var(--amber);background:rgba(255,184,77,.1);border-color:rgba(255,184,77,.3)}

.pill.r{color:var(--red);background:rgba(255,92,108,.1);border-color:rgba(255,92,108,.3)}

.pill.b{color:var(--blue);background:rgba(77,163,255,.1);border-color:rgba(77,163,255,.3)}



/* stats */

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}

.stat{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}

.stat .lbl{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;gap:6px;align-items:center}

.stat .val{font-size:21px;font-weight:800;letter-spacing:-.6px;margin-top:6px}

.stat .val.g{color:var(--green)}

.stat .hint{font-size:11px;color:var(--dim);margin-top:2px}

.up{color:var(--green)}.down{color:var(--red)}

.ico{width:14px;height:14px;stroke:var(--green);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.ico.m{stroke:var(--muted)}



/* buttons */

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:15px;

 border:1px solid var(--line);background:#111C26;color:var(--txt);font-weight:700;cursor:pointer;padding:0 16px;

 transition:transform .12s,background .12s;-webkit-appearance:none;appearance:none;text-align:center}

.btn:active{transform:scale(.975);background:#152330}

.btn.primary{background:linear-gradient(180deg,#00F085,#00C468);color:#04140C;border-color:transparent;box-shadow:0 8px 24px -10px rgba(0,224,122,.6)}

.btn.ghost{background:transparent}

.btn.sm{min-height:44px;font-size:14px;border-radius:13px;width:auto;padding:0 15px}

.btn.tiny{min-height:38px;font-size:12.5px;border-radius:11px;padding:0 12px;width:auto}

.btn.danger{color:var(--red);border-color:rgba(255,92,108,.3);background:rgba(255,92,108,.07)}

.btn.amber{color:var(--amber);border-color:rgba(255,184,77,.3);background:rgba(255,184,77,.08)}

.btn[disabled]{opacity:.45}

.cta-row{display:flex;gap:10px;margin-top:16px}



/* inputs */

.field{margin-bottom:13px}

.field label{display:block;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:6px}

input,select{width:100%;min-height:52px;background:#0A1219;border:1px solid var(--line);border-radius:14px;color:var(--txt);

 padding:0 14px;outline:none;font-size:16px;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}

input:focus,select:focus{border-color:var(--gb);box-shadow:0 0 0 3px var(--gs)}

input::placeholder{color:#4A5A66}

input[disabled],select[disabled]{opacity:.55;background:#080E13}

input[type=number]{-moz-appearance:textfield}

input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237A8C9A' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");

 background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}

.chip{display:inline-flex;align-items:center;justify-content:center;min-height:40px;border:1px solid var(--line);background:#0A1219;

 color:var(--muted);border-radius:20px;padding:0 15px;font-size:13.5px;font-weight:700;cursor:pointer}

.chip.on{color:var(--green);border-color:var(--gb);background:var(--gs)}

.addr{display:flex;gap:8px;align-items:center;background:#0A1219;border:1px dashed var(--gb);border-radius:14px;padding:12px 13px}

.addr code{font-size:12.5px;word-break:break-all;color:#B9E9D2;line-height:1.45;flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.codebox{display:flex;gap:9px;justify-content:center;margin:16px 0}

.codebox .d{width:44px;height:54px;border-radius:13px;background:#0A1219;border:1px solid var(--gb);display:grid;place-items:center;

 font-size:22px;font-weight:800;color:var(--green)}



/* tabs */

.tabs{display:flex;gap:6px;background:#0A1219;border:1px solid var(--line);border-radius:15px;padding:5px;overflow-x:auto;scrollbar-width:none}

.tabs::-webkit-scrollbar{display:none}

.tab{flex:1;display:grid;place-items:center;min-height:42px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0 10px}

.tab.on{background:#132029;color:var(--green)}



/* lists */

.lst{display:flex;flex-direction:column;gap:10px}

.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;min-width:0}

.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;

 background:linear-gradient(140deg,#122430,#0D1A22);border:1px solid var(--line);color:var(--green)}

.item .t{flex:1;min-width:0}

.item .t b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.2px;overflow-wrap:break-word}

.item .t span{font-size:12.5px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stars{color:var(--amber);font-size:12.5px;letter-spacing:1px;white-space:nowrap}



/* table */

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}

.tbl th{text-align:left;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:700;padding:0 0 9px}

.tbl td{padding:11px 0;border-top:1px solid var(--line);vertical-align:middle}

.tbl td:last-child,.tbl th:last-child{text-align:right}

.tbl .pair{font-weight:700;letter-spacing:-.2px;white-space:nowrap}



/* reviews */

.rev-scroll{display:flex;gap:11px;overflow-x:auto;overscroll-behavior-x:contain;padding:2px 16px 6px;

 scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}

.rev-scroll::-webkit-scrollbar{display:none}

.rev{min-width:270px;max-width:270px;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}

.rev p{font-size:13px;line-height:1.5;color:#C6D4DE;margin:9px 0 0}



/* banner */

.banner{display:flex;gap:11px;align-items:flex-start;background:linear-gradient(180deg,rgba(0,224,122,.09),rgba(0,224,122,.03));

 border:1px solid var(--gb);border-radius:16px;padding:13px 14px;margin-bottom:14px}

.banner.warn{background:linear-gradient(180deg,rgba(255,184,77,.12),rgba(255,184,77,.03));border-color:rgba(255,184,77,.35)}

.banner.blue{background:linear-gradient(180deg,rgba(77,163,255,.1),rgba(77,163,255,.03));border-color:rgba(77,163,255,.3)}

.banner.red{background:linear-gradient(180deg,rgba(255,92,108,.1),rgba(255,92,108,.03));border-color:rgba(255,92,108,.3)}

.banner b{font-size:13.5px;display:block}

.banner span{font-size:12.5px;color:var(--muted);display:block}



/* bot card */

.bot{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:11px}

.bot.on{border-color:var(--gb);box-shadow:0 0 0 1px rgba(0,224,122,.12) inset}

.bot .hd{display:flex;gap:11px;align-items:center;min-width:0}

.bot .nm{font-weight:800;font-size:15px;letter-spacing:-.3px}

.bot .ds{font-size:12.5px;color:var(--dim);margin-top:2px}

.spark{width:84px;height:34px;flex:none}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

.metric{background:#0A1219;border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0}

.metric .k{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);font-weight:700}

.metric .v{font-size:14px;font-weight:800;margin-top:3px}



/* drawer */

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}

.scrim.on{opacity:1;pointer-events:auto}

.drawer{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:84vw;background:#0A1219;border-right:1px solid var(--line);

 z-index:70;transform:translateX(-102%);transition:transform .26s cubic-bezier(.3,.85,.3,1);

 padding:calc(16px + var(--sat)) 14px calc(20px + var(--sab));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.drawer.on{transform:none}

.drawer .lnk{display:flex;align-items:center;gap:11px;min-height:50px;padding:0 12px;border-radius:13px;font-weight:600;color:#C6D4DE;cursor:pointer}

.drawer .lnk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.drawer .lnk:active,.drawer .lnk.on{background:#111C26;color:var(--green)}



/* tabbar */

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:50;

 display:grid;grid-template-columns:repeat(5,1fr);gap:2px;

 background:rgba(8,14,19,.97);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);

 border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab));

 transition:transform .2s cubic-bezier(.3,.85,.3,1)}

.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;border-radius:13px;

 color:var(--dim);font-size:10px;font-weight:700}

.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.tb.on{color:var(--green)}

.tb.on svg{stroke:var(--green)}

.tb:active{background:#101C26}



/* toast */

.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 14px);transform:translate(-50%,18px);background:#101C26;border:1px solid var(--gb);

 color:var(--txt);padding:13px 17px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:90;opacity:0;

 transition:opacity .22s,transform .22s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 16px 40px -16px #000}

.toast.on{opacity:1;transform:translate(-50%,0)}



/* misc */

.ticker{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted);background:#0A1219;border:1px solid var(--line);

 border-radius:13px;padding:10px 12px;overflow:hidden;white-space:nowrap}

.ticker span{overflow:hidden;text-overflow:ellipsis}

.steps{display:flex;flex-direction:column;gap:11px}

.step{display:flex;gap:12px}

.step .n{width:28px;height:28px;flex:none;border-radius:9px;background:var(--gs);border:1px solid var(--gb);color:var(--green);

 font-weight:800;font-size:13px;display:grid;place-items:center}

details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px}

details summary{font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}

details summary::-webkit-details-marker{display:none}

details summary:after{content:'+';color:var(--green);font-size:18px;font-weight:800;line-height:1}

details[open] summary:after{content:'–'}

details p{margin:10px 0 0;font-size:13.5px}

.foot{padding:22px 16px calc(10px + var(--sab));text-align:center;color:var(--dim);font-size:11.5px;line-height:1.6}

.center{text-align:center}

.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:14px}

.green{color:var(--green)}.amber{color:var(--amber)}.blue{color:var(--blue)}

.mini{font-size:11.5px;color:var(--dim)}

.a2hs{position:fixed;left:50%;transform:translate(-50%,140%);bottom:calc(var(--bar) + 8px);width:calc(100% - 28px);max-width:492px;

 z-index:55;background:#0F1A23;border:1px solid var(--gb);border-radius:16px;padding:12px 14px;display:flex;gap:11px;align-items:center;

 box-shadow:0 18px 44px -18px #000;transition:transform .3s cubic-bezier(.3,.85,.3,1)}

.a2hs.on{transform:translate(-50%,0)}

.a2hs b{font-size:13px;display:block}

.a2hs span{font-size:11.5px;color:var(--muted);display:block}

.a2hs .x{width:30px;height:30px;flex:none;border-radius:9px;background:#16242F;display:grid;place-items:center;color:var(--muted);font-weight:800;cursor:pointer}

</style>

  <div class="tabs mb">${tabs.map(t=>`<div class="tab ${ADMIN_TAB===t[0]?'on':''}" data-action="admin-tab" data-tab="${t[0]}">${t[1]}</div>`).join('')}</div>

  ${body}

  <div class="hr"></div>

  <div class="mini center">Admin code: ${CFG.adminCode} · engine ${CFG.botEngine?'running':'paused'}</div>

 </div>`;

}

function adminTxRow(t){const dep=t.type==='deposit';

 const st=t.status==='credited'?'g':t.status==='pending'?'a':t.status==='paid'?'g':'r';

 return `<div class="item"><div class="av" style="color:${dep?'#00E07A':'#FFB84D'}">${dep?'↓':'↑'}</div>

  <div class="t"><b>${dep?'Deposit':'Payout'} ${eur2(t.amount)}</b><span>${t.email}</span></div>

  <span class="pill ${st}">${t.status}</span></div>`}



/* ================= render ================= */

function render(){

 const r=route();

 if(PROTECTED.includes(r)&&!me()){location.hash='#/login';return}

 if((r==='login'||r==='register')&&me()&&isVerified(me())){location.hash='#/dashboard';return}

 if(NEEDS_VERIFY.includes(r)&&!isVerified(me())){location.hash='#/verify';return}

 renderChrome();

 const u=me();if(u){ensure(u);save()}

 const V={landing:vLanding,login🙁)=>vAuth('login'),register🙁)=>vAuth('register'),verify:vVerify,dashboard:vDashboard,bots:vBots,deposit:vDeposit,withdraw:vWithdraw,account:vAccount,admin:vAdmin};

 $('#view').innerHTML=V[r]();

 $('#foot').style.display=(r==='landing'||r==='admin')?'none':'block';

 window.scrollTo({top:0,behavior:'instant'});

}

function renderKeep(oldBal,up){render();if(oldBal===undefined)return;const u=me();if(!u)return;

 const els=[$('#hdrBal'),$('#dash-bal'),$('#wd-bal'),$('#dep-bal')];

 els.forEach(el=>{if(el)animNum(el,oldBal,u.balance,700,eur2)});

 flash($('#hdrBal'),up);flash($('#dash-bal'),up)}



/* ================= events ================= */

document.addEventListener('click',e=>{

 const a=e.target.closest('[data-action]');

 if(a){const act=a.dataset.action;buzz(6);

  if(act==='drawer'){openDrawer();return}

  if(act==='close-drawer'){closeDrawer();return}

  if(act==='a2hs-close'){$('#a2hs').classList.remove('on');LS.s('a2hsOff',1);return}

  if(act==='copy'){const txt=a.dataset.copy;

   if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Copied')).catch(()=>toast('Copy: '+txt));else toast('Copy: '+txt);return}

  if(act==='logout'){SESSION=null;save();toast('Logged out');go('#/');return}

  if(act==='reset'){['users','session','tx'].forEach(LS.c);USERS=[];SESSION=null;TX=[];toast('Demo data reset');go('#/');return}

  if(act==='connect-wallet'){const u=me();if(!u)return;

   if(!u.wallet.connected){u.wallet={connected:true,address:randAddr(),at😀ate.now()};save();toast('Wallet connected');buzz([10,30,10])}

   else toast('Wallet already connected');

   render();

   setTimeout(()=>{try{if(CFG.connectMode==='same')location.href=CFG.connectUrl;else window.open(CFG.connectUrl,'_blank')}catch(err){}},350);

   return}

  if(act==='toggle-bot'){const u=me();if(!u)return;const id=a.dataset.bot;

   if(!isVerified(u)){toast('Confirm your email first');go('#/verify');return}

   if(!isActive(u)){toast('Deposit at least '+eur(CFG.minDeposit)+' first');go('#/deposit');return}

   const old=u.balance;

   if(u.bots.includes(id)){const p=u.pos.find(x=>x.bot===id);const back=+((p?p.alloc:0)+(p?p.pnl:0)).toFixed(2);

    u.balance=+(u.balance+Math.max(0,back)).toFixed(2);

    u.bots=u.bots.filter(x=>x!==id);ensure(u);toast('Bot stopped · '+eur(Math.max(0,back))+' returned to balance')}

   else{const alloc=Math.max(0,Math.floor(u.balance*(CFG.allocPct/100)));

    if(alloc<25){toast('Balance too low to allocate');return}

    u.balance=+(u.balance-alloc).toFixed(2);u.bots.push(id);ensure(u);

    const p=u.pos.find(x=>x.bot===id);if(p)p.alloc=alloc;

    toast(eur(alloc)+' moved into the bot')}

   save();renderKeep(old,u.balance>old);return}

  if(act==='admin-tab'){ADMIN_TAB=a.dataset.tab;render();return}

  if(act==='admin-logout'){ADMIN=false;LS.s('admin',false);render();return}

  if(act==='admin-engine'){CFG.botEngine=!CFG.botEngine;saveCfg();toast(CFG.botEngine?'Engine running':'Engine paused');render();return}

  if(act==='admin-nuke'){USERS=[];TX=[];SESSION=null;save();toast('All accounts deleted');render();return}

  if(act==='admin-verify'){const u=USERS.find(x=>x.email===a.dataset.email);if(u){u.emailVerified=true;save();toast('Email verified: '+u.email)}render();return}

  if(act==='admin-credit'){const u=USERS.find(x=>x.email===a.dataset.email);const v=parseFloat(prompt('Add to balance (€)','100'));if(!v)return;

   u.balance=+(u.balance+v).toFixed(2);save();toast('+'+eur(v));render();return}

  if(act==='admin-debit'){const u=USERS.find(x=>x.email===a.dataset.email);const v=parseFloat(prompt('Subtract from balance (€)','100'));if(!v)return;

   u.balance=+Math.max(0,u.balance-v).toFixed(2);save();toast('−'+eur(v));render();return}

  if(act==='admin-setbal'){const u=USERS.find(x=>x.email===a.dataset.email);const v=parseFloat(prompt('Set balance to (€)',String(u.balance)));if(isNaN(v))return;

   u.balance=+v.toFixed(2);save();toast('Balance set');render();return}

  if(act==='admin-del'){const u=USERS.find(x=>x.email===a.dataset.email);if(!confirm('Delete '+u.email+'?'))return;

   USERS=USERS.filter(x=>x.email!==u.email);TX=TX.filter(t=>t.email!==u.email);save();toast('Deleted');render();return}

  if(act==='admin-pay'){const t=TX.find(x=>x.id===a.dataset.id);t.status='paid';t.paidAt=Date.now();save();toast('Marked as paid');render();return}

  if(act==='admin-reject'){const t=TX.find(x=>x.id===a.dataset.id);const u=USERS.find(x=>x.email===t.email);

   t.status='rejected';if(u)u.balance=+(u.balance+t.amount).toFixed(2);save();toast('Rejected · refunded');render();return}

  if(act==='resend'){const u=me();if(u){u.code=String(Math.floor(100000+Math.random()*900000));save();toast('New code sent');render()}return}

 }

 const tab=e.target.closest('#depTabs .tab');

 if(tab){document.querySelectorAll('#depTabs .tab').forEach(t=>t.classList.remove('on'));tab.classList.add('on');

  const m=tab.dataset.method;$('#mLabel').textContent=m;

  const map={'Solana':CFG.depositWallet,'USDT (TRC20)':'TQm3mE9xTradeBot7VeniceAImeme4coin3zP','Bitcoin':'bc1q9x8k3meme0coin7trade4bot9venice2xq7z'};

  $('#addrTxt').textContent=map[m];const cp=document.querySelector('[data-action="copy"]');if(cp)cp.dataset.copy=map[m];return}

 const chip=e.target.closest('.chip');

 if(chip){const box=chip.closest('.chips'),inp=box.closest('form').querySelector('[name=amount]');

  box.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));chip.classList.add('on');

  const u=me();if(chip.dataset.amt)inp.value=chip.dataset.amt;

  else if(chip.dataset.pct)inp.value=Math.floor((u.balance||0)*(+chip.dataset.pct/100));return}

});

function openDrawer(){$('#drawer').classList.add('on');$('#scrim').classList.add('on');

 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}

function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')}



document.addEventListener('submit',e=>{

 const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();

 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();

 const k=f.dataset.form,fd=new FormData(f),u=me();

 if(k==='register'){

  const email=(fd.get('email')+'').trim().toLowerCase(),pass=fd.get('pass')+'',name=(fd.get('name')+'').trim();

  if(pass.length<6)return toast('Password must be at least 6 characters');

  if(USERS.some(x=>x.email===email))return toast('This email is already registered');

  USERS.push({email,pass,name,balance:0,allocated:0,deposited:0,emailVerified:false,

   code:String(Math.floor(100000+Math.random()*900000)),wallet:{connected:false,address:'',at:0},

   bots:[],pos:[],created😀ate.now()});

  SESSION=email;save();toast('Account created · check your email');go('#/verify');return}

 if(k==='verify'){const c=(fd.get('code')+'').trim();

  if(c!==u.code)return toast('Wrong code, try again');

  u.emailVerified=true;save();toast('Email confirmed');go('#/deposit');return}

 if(k==='login'){const email=(fd.get('email')+'').trim().toLowerCase(),pass=fd.get('pass')+'';

  const found=USERS.find(x=>x.email===email&&x.pass===pass);

  if(!found)return toast('Wrong email or password');

  SESSION=email;save();toast('Welcome back, '+found.name.split(' ')[0]);

  go(found.emailVerified?'#/dashboard':'#/verify');return}

 if(k==='deposit'){const amt=parseFloat(fd.get('amount'));

  if(!amt||amt<CFG.minDeposit)return toast('Minimum deposit is '+eur(CFG.minDeposit));

  const old=u.balance,method=(document.querySelector('#mLabel')||{}).textContent||'Solana';

  const tx={id:'d'+Date.now(),email:SESSION,type:'deposit',amount:amt,status:'pending',ts😀ate.now(),method,ref:fd.get('ref')||''};

  TX.push(tx);save();toast('Deposit reported · verifying...');render();

  setTimeout(()=>{const cu=me();if(!cu)return;tx.status='credited';

   cu.balance=+(cu.balance+amt).toFixed(2);cu.deposited=+(cu.deposited+amt).toFixed(2);

   save();toast(eur(amt)+' credited to your balance');buzz([10,40,10]);

   if(route()==='deposit'||route()==='dashboard')renderKeep(old,true);},3600);return}

 if(k==='withdraw'){

  if(!u.wallet.connected)return toast('Connect your wallet first');

  const amt=parseFloat(fd.get('amount'));

  if(!amt||amt<CFG.minWithdraw)return toast('Minimum withdrawal is '+eur(CFG.minWithdraw));

  if(amt>u.balance)return toast('Balance too low (max '+eur2(u.balance)+')');

  const addr=(fd.get('addr')+'').trim()||u.wallet.address;

  const old=u.balance;u.balance=+(u.balance-amt).toFixed(2);

  TX.push({id:'w'+Date.now(),email:SESSION,type:'withdraw',amount:amt,status:'pending',ts😀ate.now(),

   method🙁fd.get('net')||'Solana'),addr});

  save();toast('Withdrawal requested · Pending');renderKeep(old,false);return}

 if(k==='adminlogin'){const c=fd.get('code')+'';

  if(c!==CFG.adminCode)return toast('Wrong admin code');

  ADMIN=true;LS.s('admin',true);toast('Welcome, admin');render();return}

 if(k==='adminsettings'){const g=x=>(fd.get(x)+'').trim();

  CFG.connectUrl=g('connectUrl')||DEFAULTS.connectUrl;CFG.connectMode=g('connectMode');

  CFG.depositWallet=g('depositWallet')||DEFAULTS.depositWallet;

  CFG.minDeposit=parseFloat(g('minDeposit'))||DEFAULTS.minDeposit;

  CFG.minWithdraw=parseFloat(g('minWithdraw'))||DEFAULTS.minWithdraw;

  CFG.allocPct=Math.max(1,Math.min(90,parseFloat(g('allocPct'))||DEFAULTS.allocPct));

  CFG.adminCode=g('adminCode')||DEFAULTS.adminCode;

  saveCfg();toast('Settings saved');render();return}

});



/* ================= iOS keyboard + swipe ================= */

document.addEventListener('focusin',e=>{if(e.target.matches('input,select,textarea'))document.body.classList.add('kb')});

document.addEventListener('focusout',()=>setTimeout(()=>document.body.classList.remove('kb'),120));

let tsX=0,tsY=0,tsT=0;

document.addEventListener('touchstart',e=>{const t=e.touches[0];tsX=t.clientX;tsY=t.clientY;tsT=Date.now()},{passive:true});

document.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tsX,dy=t.clientY-tsY,dt=Date.now()-tsT;

 if(dt>600||Math.abs(dx)<55||Math.abs(dy)>70)return;

 if(dx>0&&tsX❤4&&!$('#drawer').classList.contains('on'))openDrawer();

 else if(dx<0&&$('#drawer').classList.contains('on'))closeDrawer()},{passive:true});



/* ================= live ticker ================= */

function tick(){

 if(!CFG.botEngine)return;

 STATS.profit+=(Math.random()-0.34)*1400;if(STATS.profit<126000)STATS.profit+=900;if(STATS.profit>137000)STATS.profit-=900;

 STATS.roi=+(13.9+Math.random()*1.6).toFixed(1);

 if(Math.random()<0.30){STATS.users++;STATS.newToday++}

 if(Math.random()<0.12){STATS.payouts++}

 const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};

 set('stat-profit',eur(STATS.profit));set('stat-roi',STATS.roi);set('stat-users',num(STATS.users));set('dash-profit',eur(STATS.profit));

 const u=me();

 if(u&&u.pos.length){

  u.pos.forEach(p=>{p.pnl=+(p.pnl+(Math.random()-0.42)*9).toFixed(2);if(p.pnl<0)p.pnl=+(p.pnl+2).toFixed(2);

   p.pct=+(p.pct+(Math.random()-0.45)*0.14).toFixed(2);if(p.pct<0.05)p.pct=0.05;

   const el=document.querySelector('[data-live-pnl="'+p.bot+'"]');if(el)el.textContent='+$'+p.pnl.toFixed(0)});

  const tot=u.pos.reduce((s,p)=>s+p.pnl,0);set('dash-pnl',(tot>=0?'+':'')+eur2(tot));save()}

 if(Math.random()<0.5){payIdx=(payIdx+1)%PAY.length;set('payName',PAY[payIdx][0]);set('payAmt',eur(PAY[payIdx][1]))}

}

setInterval(tick,2600);



(function(){const ua=navigator.userAgent||'';

 const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

 const standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;

 if(isIOS&&!standalone&&!LS.g('a2hsOff',0))setTimeout(()=>$('#a2hs').classList.add('on'),1800)})();



window.addEventListener('hashchange',()=>{closeDrawer();render()});

render();

})();

</script>
